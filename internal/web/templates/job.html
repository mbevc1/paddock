{{define "content"}}
<h1>Working</h1>
{{template "fragment" .}}
{{end}}
{{define "fragment"}}
<div id="job"{{if not .Data.Done}} hx-get="/jobs/{{.Data.ID}}?next={{.Data.Next}}" hx-trigger="every 1s" hx-swap="outerHTML"{{end}}>
  <p>{{.Data.Job.Op}}: {{.Data.Job.Status}}</p>
  {{with .Data.Job.Error}}<p class="error" role="alert">{{.Message}}</p>{{end}}
  {{if .Data.Done}}<p><a href="{{.Data.Next}}">Continue</a></p>{{else}}<p>This page updates by itself.</p>{{end}}
</div>
{{end}}
