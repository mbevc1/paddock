{{define "content"}}
<div class="page-head">
  <h1>Vhosts</h1>
  {{if .Can "vhost.manage"}}<div class="actions"><a class="button" href="/vhosts/new">New vhost</a></div>{{end}}
</div>
<section class="flush">
<table>
  <thead><tr><th>Domain</th><th>PHP</th><th>Status</th></tr></thead>
  <tbody>
  {{range .Data}}<tr><td><a href="/vhosts/{{.ID}}">{{.Primary}}</a> <code class="muted">{{.ID}}</code></td><td>{{.PHPVersion}}</td><td><span class="badge {{.Status}}">{{.Status}}</span></td></tr>
  {{else}}<tr><td colspan="3" class="muted">No vhosts yet.</td></tr>{{end}}
  </tbody>
</table>
</section>
{{end}}
