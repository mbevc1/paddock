{{define "content"}}
<h1>Confirm admin access</h1>
<p>Admin pages need a current code from your authenticator. One code unlocks admin actions for 10 minutes.</p>
{{if .Can "server.view"}}
<form method="post" action="/admin/unlock" class="stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="next" value="{{.Data}}">
  <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required autofocus></label>
  <button type="submit">Unlock</button>
</form>
{{end}}
{{end}}
