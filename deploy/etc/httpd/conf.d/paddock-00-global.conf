MDCertificateAgreement accepted
MDNotifyCmd /usr/bin/paddock agent-notify md-renewed

<Directory />
    AllowOverride None
    Require all denied
</Directory>

# mod_md's status lists every managed domain, so it has its own privileged loopback port, which
# the paddock nftables rule keeps to root.
Listen 127.0.0.1:81
<VirtualHost 127.0.0.1:81>
    <Location "/md-status">
        SetHandler md-status
        Require local
    </Location>
</VirtualHost>
