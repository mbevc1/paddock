# Labels for pull requests by changed files, applied by .github/workflows/labeler.yaml. With
# sync-labels, a label below is also removed once its rule stops matching.
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

# Dependabot's branches match too, so its GitHub Actions updates, which change only .github/,
# keep the label it set.
dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'go.mod'
          - 'go.sum'
  - head-branch:
      - '^dependabot/'

pipelines:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

# Go source, with its embedded templates and static files. go.mod and go.sum are included so the
# label Dependabot sets on Go updates survives sync-labels.
go:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/**'
          - 'internal/**'
          - 'test/**'
          - 'go.mod'
          - 'go.sum'

# Workflow changes; Dependabot uses the same label for GitHub Actions updates.
github_actions:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'
