name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet -tags integration ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath ./cmd/paddock

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags integration

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -x scripts/*.sh poc/*.sh packaging/*.sh
      - run: packaging/bootstrap_test.sh

  rpm:
    runs-on: ubuntu-latest
    container: almalinux:9
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf -y install git tar gzip rpm-build systemd-rpm-macros rpmlint
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The checkout belongs to the runner's UID, not the container's root, and go build reads
      # git for its VCS stamp.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: scripts/build-rpm.sh 0.0.0 x86_64
      - run: rpmlint -f packaging/paddock.rpmlintrc dist/*.rpm
      - run: rpm -qp --scripts dist/*.rpm
      # Builds the module against the targeted policy store without loading it, which catches
      # unknown types and syntax errors, then looks up the label the socket directory gets.
      - name: Check the SELinux module
        run: |
          dnf -y install selinux-policy-targeted policycoreutils libselinux-utils
          semodule -n -i deploy/selinux/paddock.cil
          semodule -n -l | grep -qx paddock
          matchpathcon /run/paddock/acme
          matchpathcon /run/paddock/acme | grep -q ':httpd_var_run_t:'
